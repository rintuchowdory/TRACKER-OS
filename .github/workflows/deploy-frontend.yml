name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NPM_CONFIG_LEGACY_PEER_DEPS: "true"
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'tracker-os' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Require the API URL
        run: |
          if [ -z "$NEXT_PUBLIC_API_URL" ]; then
            echo "::error::Set the NEXT_PUBLIC_API_URL repository variable to the backend base URL; otherwise the deployed app calls http://localhost:8000."
            exit 1
          fi
      - run: npx --yes @cloudflare/next-on-pages@1
      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy .vercel/output/static --project-name="$PAGES_PROJECT" --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
