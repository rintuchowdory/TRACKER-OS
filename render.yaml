services:
  - type: web
    name: tracker-os-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DATABASE_URL
        fromDatabase:
          name: tracker-os-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://rintu-tracker-os.pages.dev

databases:
  - name: tracker-os-db
    databaseName: tracker_os
    user: tracker
    plan: free
    region: frankfurt
